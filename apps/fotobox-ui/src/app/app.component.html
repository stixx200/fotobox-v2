@if (recovery.fatalError()) {
  <app-recovery-overlay />
} @else if (showRouter()) {
  @if (recovery.networkDegraded()) {
    <div class="network-banner" role="alert">
      <mat-icon aria-hidden="true">wifi_off</mat-icon>
      <span class="network-banner__text">{{
        'RECOVERY.NETWORK_DEGRADED' | translate
      }}</span>
      <button
        type="button"
        matIconButton
        [attr.aria-label]="'RECOVERY.DISMISS' | translate"
        (click)="recovery.clearNetworkDegraded()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
  <router-outlet></router-outlet>
} @else {
  <app-splash-screen
    [errorMessage]="apiError()"
    [slowStart]="slowStart()"
    (retry)="retryApi()"
  ></app-splash-screen>
}
