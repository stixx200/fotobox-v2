[package]
name = "fotobox"
version = "1.0.0"
description = "Fotobox photo booth"
authors = ["Markus Völk <stixx200@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "fotobox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-single-instance = "2.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
