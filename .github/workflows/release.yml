name: Release

on:
  push:
    tags:
      - 'fotobox-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fotobox-tauri/src-tauri

      - name: Install dependencies
        env:
          SKIP_PLAYWRIGHT_INSTALL: 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve release version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#fotobox-v}"
          else
            TAG=$(node -p "require('./apps/fotobox-tauri/package.json').version")
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG"

      - name: Verify package.json versions match tag
        shell: bash
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./apps/fotobox-tauri/package.json').version")
          EXPECTED="${{ steps.version.outputs.version }}"
          if [[ "$ROOT_VERSION" != "$EXPECTED" || "$APP_VERSION" != "$EXPECTED" ]]; then
            echo "Version mismatch: root=$ROOT_VERSION app=$APP_VERSION expected=$EXPECTED"
            exit 1
          fi

      # Builds the UIs and API, stages the Node sidecar (this runner's Node
      # 24) and bundles the Tauri app as an NSIS setup (kiosk setup hooks).
      - name: Build Windows setup
        run: pnpm exec nx run fotobox-release:package --configuration=windows

      - name: Collect installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/packages | Out-Null
          $setup = Get-ChildItem apps/fotobox-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'No NSIS setup found' }
          Copy-Item $setup.FullName dist/packages/
          $target = Join-Path dist/packages $setup.Name
          $hash = Get-FileHash -Path $target -Algorithm SHA256
          "$($hash.Hash)  $($setup.Name)" | Out-File -FilePath "$target.sha256" -Encoding ascii

      # Provisioning kit: everything to set up a fresh Windows PC as a booth
      # (scripts/windows/provision-fotobox.ps1), locally or over SSH.
      - name: Build provisioning kit
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/packages/*-setup.exe | Select-Object -First 1
          $kit = New-Item -ItemType Directory -Force -Path dist/kit/Fotobox-Provisioning
          Copy-Item scripts/windows/provision-fotobox.ps1, scripts/windows/FotoboxProvision.psm1, `
            scripts/windows/enable-remote-access.ps1, scripts/windows/deploy-remote.ps1, `
            scripts/windows/fotobox-provision.example.psd1, scripts/windows/Fotobox-einrichten.cmd, `
            $setup.FullName -Destination $kit
          $zip = "dist/packages/Fotobox_${{ steps.version.outputs.version }}_provisioning.zip"
          Compress-Archive -Path $kit -DestinationPath $zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('fotobox-v{0}', steps.version.outputs.version) }}
          name: Fotobox v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/packages/*-setup.exe
            dist/packages/*-setup.exe.sha256
            dist/packages/*_provisioning.zip
          fail_on_unmatched_files: true
